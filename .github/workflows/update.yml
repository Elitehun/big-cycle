name: 자료 갱신과 화면 게시

on:
  schedule:
    # 미국 오전 발표 직후(한국 시각 밤 11시 17분)와 한국 아침(오전 7시 17분)에 한 번씩
    - cron: "17 14 * * *"
    - cron: "17 22 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "scripts/**"
      - "config/**"
      - "data/manual/**"
      - ".github/workflows/**"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: 자료 만들기
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          if [ -z "$FRED_API_KEY" ]; then
            echo "FRED_API_KEY 비밀값이 없습니다. 저장소 Settings > Secrets and variables > Actions 에 넣으세요."
            exit 1
          fi
          node scripts/build-web-data.mjs --refresh
      - name: 발표 기록 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state
          git diff --cached --quiet || git commit -m "자료 갱신 기록 [skip ci]"
          git push || echo "기록 저장 실패. 다음 실행에서 다시 시도합니다."
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
